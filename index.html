<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Say Game</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>

    <div class="container">
        <h1>SIMON SAY GAME</h1>
        <h2>PRESS THE START BUTTON TO PLAY</h2>

        <div class="rules-container">
            <h3>HOW TO PLAY</h3>
            <ul>
                <li>1.The game will blink a color block.</li>
                <li>2.Click that exact same block.</li>
                <li>3.Each level adds 1 new block</li>
                <li>4.Click the wrong color once and it is Game Over!</li>
            </ul>
        </div>

        <div class="btn-container">
            <div class="btn pink" id="pink">1</div>
            <div class="btn orange" id="orange">2</div>
            <div class="btn skyblue" id="skyblue">3</div>
            <div class="btn blue" id="blue">4</div>
        </div>
    <button id="start-btn">START GAME</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
